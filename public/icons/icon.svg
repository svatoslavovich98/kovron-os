<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151815"/>
      <stop offset="100%" stop-color="#111311"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2E35A"/>
      <stop offset="100%" stop-color="#8FB83A"/>
    </linearGradient>
    <!-- Mat texture pattern (subtle grid) -->
    <pattern id="matGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24L24 0M-4 4L4 -4M20 28L28 20" stroke="#ADD256" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Inner frame -->
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#ADD256" stroke-width="2" opacity="0.15"/>
  <!-- Mat texture in background circle -->
  <circle cx="256" cy="240" r="130" fill="url(#matGrid)" opacity="0.5"/>
  <!-- Stylized K made of geometric shapes -->
  <g transform="translate(256, 250)">
    <!-- Vertical bar of K -->
    <rect x="-80" y="-110" width="28" height="220" rx="6" fill="url(#accent)"/>
    <!-- Upper diagonal -->
    <path d="M-40,-20 L60,-110 L80,-90 L-20,0Z" fill="url(#accent)"/>
    <!-- Lower diagonal -->
    <path d="M-40,20 L80,110 L60,130 L-52,40Z" fill="url(#accent)" opacity="0.85"/>
    <!-- Small accent square at intersection -->
    <rect x="-48" y="-12" width="24" height="24" rx="4" fill="#111311"/>
    <rect x="-46" y="-10" width="20" height="20" rx="3" fill="url(#accent)" opacity="0.6"/>
  </g>
  <!-- KOVRON text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ADD256" text-anchor="middle" letter-spacing="14" opacity="0.9">KOVRON</text>
  <!-- Subtle underline -->
  <rect x="156" y="438" width="200" height="3" rx="1.5" fill="#ADD256" opacity="0.25"/>
</svg>
